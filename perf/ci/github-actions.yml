name: Performance Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Escenario de carga'
        required: true
        default: 'baseline'
        type: choice
        options: [ baseline, load, stress ]

jobs:

  # ── Paso 1: compilar el proyecto ───────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Build con Maven
        run: mvn -f registraduria/pom.xml clean package -DskipTests

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: registraduria/target/*.jar

  # ── Paso 2: baseline (corre en cada push/PR) ───────────────────────────────
  perf-baseline:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: app/

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Instalar k6
        run: |
          curl -s https://packagecloud.io/install/repositories/loadimpact/k6/script.deb.sh | sudo bash
          sudo apt-get install -y k6

      - name: Levantar aplicacion
        run: |
          java -jar app/*.jar &
          sleep 15
          curl -f -X POST http://localhost:8080/register \
            -H "Content-Type: application/json" \
            -d '{"name":"Smoke","id":1,"age":30,"gender":"MALE","alive":true}'

      - name: Ejecutar baseline
        run: |
          mkdir -p perf/results
          k6 run \
            -e SCENARIO=baseline \
            -e BASE_URL=http://localhost:8080 \
            perf/scripts/register_voter_k6.js \
            --out json=perf/results/baseline.json

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-baseline-results
          path: perf/results/

  # ── Paso 3: load/stress (solo workflow_dispatch) ───────────────────────────
  perf-on-demand:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: app/

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Instalar k6
        run: |
          curl -s https://packagecloud.io/install/repositories/loadimpact/k6/script.deb.sh | sudo bash
          sudo apt-get install -y k6

      - name: Levantar aplicacion
        run: |
          java -jar app/*.jar &
          sleep 15

      - name: Ejecutar escenario seleccionado
        run: |
          mkdir -p perf/results
          k6 run \
            -e SCENARIO=${{ github.event.inputs.scenario }} \
            -e BASE_URL=http://localhost:8080 \
            perf/scripts/register_voter_k6.js \
            --out json=perf/results/${{ github.event.inputs.scenario }}.json

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-${{ github.event.inputs.scenario }}-results
          path: perf/results/